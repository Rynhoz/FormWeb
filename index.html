<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hábitos de Vestimenta - UPDS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <!-- Elementos del fondo desenfocado -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Contenedor Principal -->
    <div class="main-container animate-fade-up">
        
        <!-- Brillo decorativo superior de la tarjeta -->
        <div class="top-shine"></div>

        <!-- Cabecera de la página -->
        <div class="header-content animate-fade-up delay-100">
            <!-- Icono decorativo -->
            <div class="icon-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" viewBox="0 0 256 256">
                    <path d="M214.93,64.21,170.81,39.69a15.84,15.84,0,0,0-12.87-1.39L128,49.1l-29.94-10.8a15.84,15.84,0,0,0-12.87,1.39L41.07,64.21A15.93,15.93,0,0,0,32,78.17v50.2a16,16,0,0,0,5.77,12.29l10.23,8.61V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V149.27l10.23-8.61A16,16,0,0,0,224,128.37v-50.2A15.93,15.93,0,0,0,214.93,64.21ZM208,128.37l-16,13.48V208H64V141.85l-16-13.48V78.17l40-22.21,35.61,12.84a16.14,16.14,0,0,0,8.78,0L168,56l40,22.21Z"></path>
                </svg>
            </div>
            
            <h1 class="main-title">
                Hábitos de Vestimenta
            </h1>
            <p class="subtitle">
                Estudio de tendencias, moda y preferencias de vestimenta en la comunidad estudiantil de la <span class="badge">UPDS</span>.
            </p>
        </div>

        <!-- Contenedor del Iframe de Google Forms -->
        <div class="iframe-wrapper animate-fade-up delay-200">
            
            <!-- El iframe cargará el formulario adaptándose a la pantalla con sus nuevas clases CSS -->
            <iframe 
                src="https://docs.google.com/forms/d/e/1FAIpQLScS9-s6PACCVRgCLQ7-2ipS6-w0yi8ygkvxZQYoqg7IN7rJKg/viewform?embedded=true" 
                frameborder="0" 
                marginheight="0" 
                marginwidth="0"
                class="form-iframe"
            >Cargando…</iframe>
            
        </div>
    </div>

</body>
</html>
